<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Charpente — Conjugaison</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #FFFFFF;
  --surface: #F7F5F0;
  --text: #2C2C2A;
  --muted: #7a7872;
  --faint: #a6a49d;
  --placeholder: #c2bfb7;
  --line: rgba(0,0,0,0.12);
  --line-soft: rgba(0,0,0,0.08);
  --track: #eeece6;
  --accent: #D85A30;
  --green: #1D9E75;
  --ok-bg: #E1F5EE;  --ok-line: #5DCAA5; --ok-text: #0F6E56;
  --bad-bg: #FAECE7; --bad-text: #993C1D;
  --sel-bg: #EFEFEC; --sel-line: #b8b5ae;
  --hover: #FAFAF8;
  --outside: #dedad3;
  color-scheme: light;
}
html[data-theme="dark"] {
  --bg: #1c1b19;
  --surface: #262520;
  --text: #ece9e2;
  --muted: #a6a49d;
  --faint: #7f7d77;
  --placeholder: #66645e;
  --line: rgba(255,255,255,0.14);
  --line-soft: rgba(255,255,255,0.08);
  --track: #34322d;
  --ok-bg: rgba(29,158,117,0.18);  --ok-line: #1D9E75; --ok-text: #5DCAA5;
  --bad-bg: rgba(216,90,48,0.18);  --bad-text: #F0997B;
  --sel-bg: #2f2e29; --sel-line: #66645e;
  --hover: #23221e;
  --outside: #121110;
  color-scheme: dark;
}

html, body { background: var(--bg); }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  color: var(--text);
  -webkit-tap-highlight-color: transparent;
}

/* Outside Telegram (plain browser): centre a phone-width column */
html.browser, html.browser body { background: var(--outside); }

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: var(--tg-viewport-height, 100dvh);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  padding-top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
  padding-bottom: calc(var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)) + var(--tg-content-safe-area-inset-bottom, 0px));
}
html.browser .app { box-shadow: 0 0 40px rgba(0,0,0,.08); }

/* ── Nav bar ── */
.nav-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 20px 14px;
  flex-shrink: 0;
}
.back-btn {
  background: none; border: none; cursor: pointer;
  padding: 4px; color: var(--muted); flex-shrink: 0;
  display: flex; align-items: center;
  transition: opacity .15s;
}
.back-btn:active { opacity: .5; }
html.tg .back-btn { display: none; }   /* Telegram shows its own back button */
.progress-track {
  flex: 1; height: 5px;
  background: var(--track); border-radius: 3px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: var(--accent); border-radius: 3px;
  transition: width .5s cubic-bezier(.4,0,.2,1);
  width: 0%;
}
.progress-fill.green { background: var(--green); }
.progress-count { font-size: 11px; color: var(--faint); flex-shrink: 0; min-width: 44px; text-align: right; }

/* ── Content ── */
.content {
  flex: 1;
  padding: 6px 20px 24px;
  display: flex;
  flex-direction: column;
}

.kicker {
  font-size: 10px; letter-spacing: 1.5px;
  text-transform: uppercase; margin-bottom: 10px; line-height: 1.4;
}
.kicker-verb   { color: var(--green); }
.kicker-dot    { color: var(--faint); }
.kicker-tense  { color: var(--accent); }

.question-sentence {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 20px; font-weight: 400; color: var(--text);
  line-height: 1.6; margin-bottom: 16px;
}

.blank-span {
  display: inline-block;
  min-width: 64px;
  border-bottom: 2px solid var(--accent);
  vertical-align: baseline;
  margin: 0 3px;
  text-align: center;
  transition: border-color .2s, color .2s;
}
.blank-span.correct { color: var(--green); font-style: italic; border-bottom-color: var(--green); }
.blank-span.wrong   { color: var(--accent); font-style: italic; border-bottom-color: var(--accent); text-decoration: line-through; }

.input-wrap {
  background: var(--surface); border: 0.5px solid var(--line-soft);
  border-radius: 12px; padding: 13px 15px;
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px; transition: border-color .2s;
}
.input-wrap:focus-within { border-color: rgba(216,90,48,.45); }
.input-wrap input {
  flex: 1; min-width: 0; background: none; border: none; outline: none;
  font-size: 16px; color: var(--text); font-family: inherit;
}
.input-wrap input::placeholder { color: var(--placeholder); }
.input-wrap input:disabled { opacity: 1; -webkit-text-fill-color: var(--text); }
.kbd-icon { color: var(--placeholder); flex-shrink: 0; }

/* ── Choices ── */
.choices { display: flex; flex-direction: column; gap: 9px; margin-bottom: 12px; }
.choice-btn {
  background: var(--bg); border: 1px solid var(--line);
  border-radius: 13px; padding: 13px 16px;
  font-size: 15px; color: var(--text); cursor: pointer;
  text-align: left; font-family: inherit;
  transition: all .15s; width: 100%;
}
@media (hover: hover) {
  .choice-btn:hover:not(:disabled) { border-color: var(--sel-line); background: var(--hover); }
}
.choice-btn.selected  { background: var(--sel-bg); border: 1.5px solid var(--sel-line); }
.choice-btn.rev-ok    { background: var(--ok-bg);  border: 1.5px solid var(--ok-line); color: var(--ok-text); }
.choice-btn.rev-bad   { background: var(--bad-bg); border: 1.5px solid var(--accent); color: var(--bad-text); opacity: .8; }

.correct-after { color: var(--green); font-style: italic; }

/* ── CTA ── */
.cta-btn {
  background: var(--accent); color: #fff;
  border: none; border-radius: 14px;
  padding: 15px; font-size: 16px; font-weight: 500;
  cursor: pointer; width: 100%; font-family: inherit;
  transition: opacity .15s, background .3s;
  margin-top: auto; flex-shrink: 0;
}
.cta-btn:active { opacity: .85; }
.cta-btn:disabled { opacity: .35; cursor: default; }
.cta-btn.green { background: var(--green); }
.cta-btn.ghost {
  background: none; color: var(--muted); border: 1px solid var(--line); margin-top: 10px;
}

.spacer { flex: 1; min-height: 12px; }

/* ── Home ── */
.home-head { padding: 18px 0 18px; }
.home-head h1 {
  font-family: Georgia, serif; font-size: 26px; font-weight: 400;
  margin-bottom: 6px; line-height: 1.25;
}
.home-head p { font-size: 14px; color: var(--muted); line-height: 1.5; }
.lessons { display: flex; flex-direction: column; gap: 10px; }
.lesson {
  display: flex; align-items: center; gap: 14px;
  background: var(--bg); border: 1px solid var(--line);
  border-radius: 16px; padding: 14px 16px;
  cursor: pointer; text-align: left; font-family: inherit; color: var(--text);
  width: 100%; transition: background .15s, border-color .15s;
}
.lesson:active { background: var(--hover); }
@media (hover: hover) { .lesson:hover { border-color: var(--sel-line); } }
.lesson-body { flex: 1; min-width: 0; }
.lesson-title { font-family: Georgia, serif; font-size: 17px; margin-bottom: 3px; }
.lesson-meta { font-size: 12px; color: var(--faint); }
.lesson-meta .resume { color: var(--accent); }
.lesson-meta .best   { color: var(--green); }
.lesson-bar { height: 3px; background: var(--track); border-radius: 2px; overflow: hidden; margin-top: 8px; }
.lesson-bar div { height: 100%; background: var(--accent); border-radius: 2px; }
.lesson-bar div.done { background: var(--green); }
.lesson-chev { color: var(--placeholder); flex-shrink: 0; }
.lesson.all { background: var(--surface); border-color: var(--line-soft); }

/* ── Completion ── */
.completion {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; flex: 1; padding: 32px 0 0;
}
.completion-ring {
  width: 72px; height: 72px; border-radius: 50%;
  background: var(--ok-bg);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 20px;
}
.completion h2 {
  font-family: Georgia, serif; font-size: 22px;
  font-weight: 400; color: var(--text); margin-bottom: 8px;
}
.completion .sub { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 28px; }
.completion .btns { width: 100%; margin-top: auto; }
.hi { color: var(--accent); font-weight: 600; }

[hidden] { display: none !important; }
</style>
</head>

<script>
/* ──────────────────────────────────────
   Telegram
────────────────────────────────────── */
const tg = window.Telegram && window.Telegram.WebApp;
const IN_TG = !!(tg && tg.initData);
const can = v => IN_TG && tg.isVersionAtLeast(v);

document.documentElement.classList.add(IN_TG ? 'tg' : 'browser');

function applyTheme() {
  const dark = IN_TG
    ? tg.colorScheme === 'dark'
    : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  if (can('6.1')) {
    const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    tg.setHeaderColor(bg);
    tg.setBackgroundColor(bg);
  }
  if (can('7.10')) tg.setBottomBarColor(getComputedStyle(document.documentElement).getPropertyValue('--bg').trim());
}

if (IN_TG) {
  tg.ready();
  tg.expand();
  if (can('7.7')) tg.disableVerticalSwipes();   // so scrolling doesn't close the app
  tg.onEvent('themeChanged', applyTheme);
  if (can('6.1')) tg.BackButton.onClick(goHome);
}
applyTheme();

const haptic = {
  ok()   { if (can('6.1')) tg.HapticFeedback.notificationOccurred('success'); },
  bad()  { if (can('6.1')) tg.HapticFeedback.notificationOccurred('error'); },
  tap()  { if (can('6.1')) tg.HapticFeedback.selectionChanged(); },
};

/* Usage stats via GoatCounter (doudouroryos.goatcounter.com).
   Only page/event names are sent — no Telegram user data. */
window.goatcounter = { no_onload: true, allow_frame: true };
const stats = {
  hit() {
    if (!window.goatcounter.count) return;
    goatcounter.count(IN_TG
      ? { path: '/telegram', title: 'Ouvert dans Telegram' }
      : { path: '/navigateur', title: 'Ouvert dans un navigateur' });
  },
  event(name) {
    if (window.goatcounter.count) goatcounter.count({ path: name, event: true });
  },
};
(() => {
  const s = document.createElement('script');
  s.async = true;
  s.src = 'https://gc.zgo.at/count.js';
  s.dataset.goatcounter = 'https://doudouroryos.goatcounter.com/count';
  s.onload = stats.hit;
  document.head.appendChild(s);
})();

/* Progress is kept in Telegram CloudStorage (synced across the user's
   devices), falling back to localStorage in a normal browser. */
const STORE_KEY = 'progress_v1';
const store = {
  load() {
    return new Promise(res => {
      if (can('6.9')) {
        tg.CloudStorage.getItem(STORE_KEY, (err, v) => res(err ? null : v));
      } else {
        try { res(localStorage.getItem(STORE_KEY)); } catch { res(null); }
      }
    });
  },
  save(obj) {
    const v = JSON.stringify(obj);
    if (can('6.9')) tg.CloudStorage.setItem(STORE_KEY, v);
    else { try { localStorage.setItem(STORE_KEY, v); } catch {} }
  },
};

/* ──────────────────────────────────────
   Helpers
────────────────────────────────────── */
const norm = s =>
  s.toLowerCase()
   .normalize('NFD').replace(/[̀-ͯ]/g, '')
   .replace(/[’‘`]/g, "'")
   .replace(/\s+/g, ' ')
   .trim();

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ──────────────────────────────────────
   Lessons: one per tense, in order of appearance
────────────────────────────────────── */
const tenseOf = ex => (ex.k.split(' · ')[1] || 'AUTRES');
const prettyTense = t => {
  const s = t.replace(/ DE L'INDICATIF$/, '').toLowerCase();
  return s.charAt(0).toUpperCase() + s.slice(1);
};

const LESSONS = [];
EX.forEach(ex => {
  const key = tenseOf(ex);
  let l = LESSONS.find(l => l.key === key);
  if (!l) { l = { key, title: prettyTense(key), kicker: key, items: [] }; LESSONS.push(l); }
  l.items.push(ex);
});
LESSONS.push({ key: 'ALL', title: 'Tout réviser', kicker: 'TOUS LES TEMPS', items: EX, all: true });

/* ──────────────────────────────────────
   State
────────────────────────────────────── */
let progress = {};          // { [lessonKey]: { idx, score, best } }
let lesson = null, list = [];
let idx = 0, score = 0, answered = false, picked = null;

function saveLesson(patch) {
  progress[lesson.key] = Object.assign({}, progress[lesson.key], patch);
  store.save(progress);
}

/* ──────────────────────────────────────
   Home
────────────────────────────────────── */
function goHome() {
  lesson = null;
  $('navBar').hidden = true;
  if (can('6.1')) tg.BackButton.hide();

  const user = IN_TG && tg.initDataUnsafe && tg.initDataUnsafe.user;
  const hello = user && user.first_name ? `Bonjour, ${esc(user.first_name)} !` : 'Bonjour !';

  let html = `
    <div class="home-head">
      <div class="kicker"><span class="kicker-tense">Charpente</span><span class="kicker-dot"> · </span><span class="kicker-verb">Conjugaison</span></div>
      <h1>${hello}</h1>
      <p>Choisissez un temps de l'indicatif à réviser.</p>
    </div>
    <div class="lessons">`;

  LESSONS.forEach((l, i) => {
    const p = progress[l.key] || {};
    const n = l.items.length;
    const inProgress = p.idx > 0 && p.idx < n;
    let meta = `${n} exercices`;
    if (inProgress) meta += ` · <span class="resume">reprendre ${p.idx + 1}/${n}</span>`;
    else if (p.best != null) meta += ` · <span class="best">meilleur score ${p.best} %</span>`;
    const barPct = inProgress ? (p.idx / n) * 100 : (p.best != null ? 100 : 0);
    html += `
      <button class="lesson${l.all ? ' all' : ''}" onclick="openLesson(${i})">
        <div class="lesson-body">
          <div class="lesson-title">${esc(l.title)}</div>
          <div class="lesson-meta">${meta}</div>
          ${barPct ? `<div class="lesson-bar"><div class="${inProgress ? '' : 'done'}" style="width:${barPct}%"></div></div>` : ''}
        </div>
        <svg class="lesson-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>`;
  });
  html += `</div>`;
  $('main').innerHTML = html;
  window.scrollTo(0, 0);
}

function openLesson(i) {
  haptic.tap();
  lesson = LESSONS[i];
  list = lesson.items;
  const p = progress[lesson.key] || {};
  if (p.idx > 0 && p.idx < list.length) { idx = p.idx; score = p.score || 0; }
  else { idx = 0; score = 0; }
  stats.event('Leçon ouverte : ' + lesson.title);
  $('navBar').hidden = false;
  if (can('6.1')) tg.BackButton.show();
  render();
}

/* ──────────────────────────────────────
   Progress bar
────────────────────────────────────── */
function updateBar() {
  const pct = (idx / list.length) * 100;
  const fill = $('progFill');
  fill.style.width = pct + '%';
  fill.classList.toggle('green', idx >= list.length);
  $('progCount').textContent = Math.min(idx + 1, list.length) + '/' + list.length;
}

/* ──────────────────────────────────────
   Exercise
────────────────────────────────────── */
function render() {
  if (idx >= list.length) { showDone(); return; }
  updateBar();
  answered = false; picked = null;

  const ex = list[idx];
  const isFill = !ex.type || ex.type === 'fill';
  const [before = '', after = ''] = ex.q.split('___');

  const kParts = ex.k.split(' · ');
  const kHtml = kParts.length === 2
    ? `<span class="kicker-verb">${esc(kParts[0])}</span><span class="kicker-dot"> · </span><span class="kicker-tense">${esc(kParts[1])}</span>`
    : esc(ex.k);

  let html = `<div class="kicker">${kHtml}</div>`;
  html += `<div class="question-sentence">${esc(before)}<span class="blank-span" id="blankEl">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>${esc(after)}</div>`;

  if (isFill) {
    html += `
      <form class="input-wrap" id="inWrap" onsubmit="event.preventDefault(); answered ? next() : checkFill();">
        <input id="inp" type="text" placeholder="votre réponse…"
               autocomplete="off" autocorrect="off" autocapitalize="off"
               spellcheck="false" enterkeyhint="go"/>
        <svg class="kbd-icon" width="17" height="17" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="6" width="20" height="12" rx="2"/>
          <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/>
        </svg>
      </form>`;
  } else {
    html += `<div class="choices">`;
    ex.c.forEach((ch, i) => {
      html += `<button class="choice-btn" data-idx="${i}" onclick="pick(this)">${esc(ch)}</button>`;
    });
    html += `</div>`;
  }

  html += `<div class="spacer"></div>`;
  html += `<button class="cta-btn" id="btn" ${isFill ? '' : 'disabled'}>Vérifier →</button>`;

  $('main').innerHTML = html;
  $('btn').onclick = isFill ? checkFill : checkChoice;
  if (isFill) $('inp').focus();
}

function checkFill() {
  if (answered) return;
  const inp = $('inp');
  const val = inp.value.trim();
  if (!val) return;

  answered = true;
  inp.disabled = true;

  const ex = list[idx];
  const ok = norm(val) === norm(ex.a);
  if (ok) score++;

  const blank = $('blankEl');
  blank.textContent = val;
  blank.classList.add(ok ? 'correct' : 'wrong');
  if (!ok) showCorrectAfter(ex.a);

  afterAnswer(ok);
}

function pick(el) {
  if (answered) return;
  haptic.tap();
  document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  picked = parseInt(el.dataset.idx, 10);
  $('btn').disabled = false;
}

function checkChoice() {
  if (picked === null || answered) return;
  answered = true;
  const ex = list[idx];
  const chosen = ex.c[picked];
  const ok = chosen === ex.a;
  if (ok) score++;

  document.querySelectorAll('.choice-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent.trim() === ex.a) b.classList.add('rev-ok');
    else if (b.classList.contains('selected')) b.classList.add('rev-bad');
  });

  const blank = $('blankEl');
  blank.textContent = chosen;
  blank.classList.add(ok ? 'correct' : 'wrong');
  if (!ok) showCorrectAfter(ex.a);

  afterAnswer(ok);
}

function showCorrectAfter(correct) {
  const hint = document.createElement('span');
  hint.className = 'correct-after';
  hint.textContent = ' (' + correct + ')';
  document.querySelector('.question-sentence').appendChild(hint);
}

function afterAnswer(ok) {
  ok ? haptic.ok() : haptic.bad();
  saveLesson({ idx: idx + 1, score });
  const btn = $('btn');
  btn.textContent = 'Continuer →';
  btn.onclick = next;
  btn.disabled = false;
  if (ok) btn.classList.add('green');
}

function next() { idx++; render(); }

/* ──────────────────────────────────────
   Completion
────────────────────────────────────── */
function showDone() {
  const fill = $('progFill');
  fill.style.width = '100%';
  fill.classList.add('green');
  $('progCount').textContent = list.length + '/' + list.length;

  const pct = Math.round((score / list.length) * 100);
  const msg = pct === 100 ? 'Parfait !' : pct >= 80 ? 'Excellent travail !' : pct >= 60 ? 'Bon travail !' : 'Continuez à pratiquer !';
  const prevBest = (progress[lesson.key] || {}).best;
  saveLesson({ idx: 0, score: 0, best: Math.max(prevBest || 0, pct) });
  haptic.ok();
  const band = pct === 100 ? '100 %' : pct >= 80 ? '80–99 %' : pct >= 60 ? '60–79 %' : 'moins de 60 %';
  stats.event('Leçon terminée : ' + lesson.title + ' (' + band + ')');

  $('main').innerHTML = `
    <div class="completion">
      <div class="completion-ring">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none"
             stroke="#1D9E75" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      </div>
      <div class="kicker"><span class="kicker-tense">${esc(lesson.kicker)}</span><span class="kicker-dot"> · </span><span class="kicker-verb">TERMINÉ</span></div>
      <h2>${msg}</h2>
      <p class="sub">
        Score : <span class="hi">${score} / ${list.length}</span><br>
        Réussite : <span class="hi">${pct} %</span>
      </p>
      <div class="btns">
        <button class="cta-btn" onclick="restart()">Recommencer →</button>
        <button class="cta-btn ghost" onclick="goHome()">Choisir un autre temps</button>
      </div>
    </div>`;
}

function restart() { idx = 0; score = 0; render(); }

/* Enter → next once the answer is shown (desktop keyboards) */
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && answered && e.target.tagName !== 'INPUT') { e.preventDefault(); next(); }
});

/* ── Start ── */
store.load().then(v => {
  try { progress = JSON.parse(v) || {}; } catch { progress = {}; }
  goHome();
});
</script>
</body>
</html>
